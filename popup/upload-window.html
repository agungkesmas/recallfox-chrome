<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Upload File — RecallFox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      background: #fafaf9;
      color: #1c1917;
      min-width: 360px;
    }
    h2 { font-size: 16px; margin-bottom: 8px; }
    p { font-size: 12px; color: #57534e; margin-bottom: 16px; line-height: 1.5; }
    .dropzone {
      border: 2px dashed #c0c0c0;
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }
    .dropzone:hover { border-color: #6366f1; background: #f5f3ff; }
    .dropzone-icon { font-size: 36px; margin-bottom: 8px; }
    .dropzone-text { font-weight: 600; font-size: 13px; color: #1c1917; }
    .dropzone-hint { font-size: 11px; color: #a8a29e; margin-top: 4px; }
    .status {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.show { display: block; }
    .status.ok { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .status.err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status.info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .file-list { margin-top: 12px; font-size: 11px; color: #57534e; }
    .file-list-item { padding: 4px 0; border-bottom: 1px solid #e7e5e4; }
    .file-list-item:last-child { border-bottom: none; }
    .btn-row { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-close { background: #f5f5f4; color: #57534e; }
    .btn-close:hover { background: #e7e5e4; }
  </style>
</head>
<body>
  <h2>📄 Upload File Teks</h2>
  <p>Pilih file teks (.md, .txt, .json, .html, .csv, .yaml) — maks 2MB per file. File akan disimpan ke Vault RecallFox.</p>
  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">📄</div>
    <div class="dropzone-text">Klik untuk pilih file</div>
    <div class="dropzone-hint">Atau drag & drop file ke sini</div>
  </div>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,.json,.html,.htm,.csv,.yaml,.yml" multiple style="display:none">
  <div class="status" id="status"></div>
  <div class="file-list" id="fileList"></div>
  <div class="btn-row">
    <button class="btn btn-close" id="closeBtn">Tutup</button>
  </div>
  <script src="upload-window.js"></script>
</body>
</html>
